services:
  - type: web
    name: eom-timetracker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python time_tracker_api.py
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TIMEZONE
        value: America/Chicago
      - key: ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/data
      - key: TRUST_PROXY
        value: "true"
      # Trusted proxy hops between the app and the internet (Render edge = 1).
      # The real client IP is read this many hops from the right of
      # X-Forwarded-For, so a client cannot spoof it by prepending fake entries.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ACCESS_START_HOUR
        value: "6"
      - key: ACCESS_END_HOUR
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: eom-timetracker-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://effinghamofficemaids.com,https://www.effinghamofficemaids.com,https://effingham-office-maids-website.vercel.app
      - key: ALLOWED_ORIGIN_REGEX
        value: '^https://effingham-office-maids-[a-z0-9-]+-juan-canfields-projects\.vercel\.app$'
      - key: PUBLIC_APP_URL
        sync: false
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: ATLAS_RECEIVABLES_BASE_URL
        sync: false
      - key: ATLAS_RECEIVABLES_SERVICE_TOKEN
        sync: false
      - key: ATLAS_RECEIVABLES_TIMEOUT_SECONDS
        value: "10"
    disk:
      name: eom-data
      mountPath: /opt/render/project/data
      sizeGB: 1

databases:
  - name: eom-timetracker-db
