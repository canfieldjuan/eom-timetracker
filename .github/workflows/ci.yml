name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: eom_test
          POSTGRES_PASSWORD: eom_test
          POSTGRES_DB: eom_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -v -rA --tb=short
        env:
          DATABASE_URL: postgresql://eom_test:eom_test@localhost:5433/eom_test

  # BLOCKING quality gate (ratcheted from warn-first 2026-07-22 after the backlog
  # reached zero: ruff findings fixed, brittleness scan clean). A failure here
  # fails the build. Rules stay narrow (real-bug ruff rules in ruff.toml; the
  # brittleness scan targets patterns this codebase has actually been bitten by).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ruff (blocking — real-bug rules only, see ruff.toml)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check backend --output-format=github

      - name: Brittle-pattern scan (blocking)
        run: node scripts/check_brittle_patterns.mjs --strict backend/time_tracker_api.py
